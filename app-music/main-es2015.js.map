<div class="head-page" *ngIf="identity ">
    <h1>{{titulo}}</h1>

        <a *ngIf="identity.role=='ROLE_ADMIN'" [routerLink]="['/create-artist']" class="btn btn-light">Add Artist</a>
        
        <nav aria-label="Page navigation example">
        <ul class="pagination">
            <li class="page-item"> <a class="page-link" [routerLink]="['/artist',prev_page]">Previus</a></li>
            <li class="page-item"> <a class="page-link" [routerLink]="['/artist',next_page]">Next</a></li>
        </ul>
        </nav>

        <ul class="artist_list" *ngIf="identity">
            <li *ngFor="let artist of artists" class=" artist-item">
        
                <div class="artist-img">
                    <img src="{{url+'get-img-artist/'+artist.image }}">
                </div>
                <div class="artist-container">
                    <div class="artist-name" *ngIf="identity.role=='ROLE_ADMIN'">
                        <a [routerLink]="['/edit-artist',artist._id]"> editar</a>
                        <a (click)="OndeleteConfirm(artist._id)"> eliminar</a>
                    </div>
                    <a class="artist-name " id="borderr" [routerLink]="['/artistt',artist._id]">
                        {{artist.name}}
                    </a>
                    <div class="seguro" *ngIf="confirmado ==artist._id">
                        <a (click)="onDeleteArtist(artist._id)" class="btn btn-danger"> Eliminar</a>
                        <a (click)="onCancelArtist()" class="btn btn-primary"> Cancelar</a>
                    </div>
                </div>
        
        
            </li>
        
        </ul>
</div>
