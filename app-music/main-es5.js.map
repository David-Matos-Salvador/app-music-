<div *ngIf="album" class="artist-box">
    <div id="artist-head-card">
        <div class="image">
            <img src="{{url+'get-img-album/'+album.image }}" *ngIf="album.image && album.image !== 'null'">
        </div>
        <div class="data">
            <h1>{{album.title}}</h1>
            <p>{{album.year}}</p>
            <div class="inner">
                <p class="description">
                    {{album.description}}
                </p>
                <a *ngIf="identity.role=='ROLE_ADMIN'" [routerLink]="['/create-song',album._id]"
                    class="btn btn-outline-light pull-right ml-3 ">Add Song</a>
            </div>
        </div>
    </div>
    <div id="gallery-songs" *ngIf="song">
        <ul id="song-list">
            <li *ngFor="let song of song" class="song-item">
                <div class="song-detail">
                    <a (click)="startPlayer(song)" class=" btn btn-success">
                        <i class="far fa-play-circle" aria-hidden="true"></i>
                    </a>
                    <div class="title">
                        <p>{{song.number+'. '+song.name+'. '+song.duration}}</p>
                    </div>
                    <div class="left-btn" *ngIf="identity && identity.role=='ROLE_ADMIN'">  
                        <div *ngIf="confirmado==song._id">
                            <a  (click)="onDeleteSong(song._id)" class="btn btn-danger">Eliminar</a>
                            <a (click)="onCancelSong()" class="btn btn-primary">Cancelar</a>
                        </div>
                        <div>
                            <a [routerLink]="['/edit-song',song._id]" class="btn btn-warning">Editar</a>
                            <a (click)="onDeleteConfirm(song._id)" class="btn btn-danger">Borrar</a>
                        </div>
                    </div>
                    <hr>
                </div>
                
            </li>

        </ul>

    </div>
</div>
