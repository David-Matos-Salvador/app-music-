
    
    <form #userUpdateForm="ngForm"(ngSubmit)="onSubmit()" class=" col-6 ">    
      <h3>{{titulo}}</h3>
        <div *ngIf="alertUpdate" class="alert alert-info">
          <strong>{{alertUpdate}} </strong>
        </div>
        <div class="form-group ">
          <label for="inputEmail4">Correo Electronico</label>
          <input type="emai l"  #email="ngModel" [(ngModel)]="user.email" name="email" class="form-control" >
          <span *ngIf="!email.valid && email.touched">El email es obligatorio</span>
        </div>        
        <div class="form-row">
          <div class="form-group col-md-6">
            <label >Name</label>
            <input type="text" #name="ngModel"  name="name"[(ngModel)]="user.name" class="form-control" >
            <span *ngIf="!name.valid && name.touched">El nombre es obligatorio</span>
          </div>
          <div class="form-group col-md-6">
            <label >Surname</label>
            <input type="text" #surname="ngModel" name="surname"[(ngModel)]="user.surname" class="form-control">
            <span *ngIf="!surname.valid && surname.touched">Los apellidos son Obligatorios</span>
          </div>
          <div class="form-group col-md-6">
            <label >Sube la Foto</label>
            <div class="custom-file">
                <input type="file" class="custom-file-input" (change)="fileChangeEvent($event)" id="customFile">
                <label class="custom-file-label" for="customFile">Elige la imagen</label>
              </div>
          </div>
         
          <div class="form-group col-md-6" *ngIf="user.image && user.image!='null'">
           <img src="{{url+'get-image/'+user.image}}" alt="" class="img-thumbnail">
          </div>     
         
         
        </div>        
        <button type="submit" class="btn btn-outline-light">Update data</button>    
         
    </form>
