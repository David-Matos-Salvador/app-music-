<div class="album-image">
    <span *ngIf="song.album" class="image">
        <img src="{{url+'get-img-album/'+song.album.image}}" id="play-image-album">
    </span>
    <div *ngIf="!song.album" class="image">
        <img src="assets/image/default.jpg" alt="default" id="play-image-album">
    </div>
</div>
<div class="audio-file">
    <p>Reproduciendo ...</p>
    <span id="play-song-title">
        {{song.name}}
    </span>

    <span id="play-song-artist" *ngIf="song.artist">        
            {{song.album.artist.name}}      
    </span>
    <audio controls class="player-audio" id="player">
        <source id="mp3-source" src="{{url+'get_song/'+song.file}}" type="audio/mpeg">
        El navegador no soporta la reproduccion del audio
    </audio>
</div>
