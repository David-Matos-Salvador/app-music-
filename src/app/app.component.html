<div class="container-fluid">
  <div class="row">
  <div *ngIf="identity" class="navigation ">
    <div class="sidebar">
    <h1 class="head-title">
      <a [routerLink]="['/']">{{title}}</a>
    </h1>
    <nav class="">
      <a class="nav-link active" href="#"><i class="fas fa-home"></i>Home <span class="sr-only">(current)</span></a>
      <a class="nav-link active" href="#"><i class="fab fa-searchengin"></i>Buscar</a>
      <a class="nav-link active" [routerLink]="['/artist',1]" [routerLinkActive]="['actived']"><i class="fas fa-microphone-alt"></i>Artista</a>
      <a class="nav-link active" href="#"><i class="fas fa-compact-disc"></i>Album</a>
      <div id="user_logged">
        <hr>
      <div class="nav-link active">
        <img id="img-logged" src="{{url+'get-image/'+identity.image}}" alt="" class="img-thumbnail" style="width:7rem ">
      </div>
      <a class="nav-link active text-capitalize" href="" id="nameandsurname">{{identity.name}}, {{identity.surname}}</a>
      <a class="nav-link active " [routerLink]="['mis-datos']" [routerLinkActive]="['actived']"><i class="fas fa-user-cog "></i>
        Mis Datos</a>

    </div>
    
    </nav>
  </div>
</div>



  <div *ngIf="identity"  >
    <div id="main"class="p-5 ">
      <router-outlet></router-outlet>
    </div>
    <div class="player">
      <app-player ></app-player>
    </div>
    
  </div>
</div>
<!------------------------------->
<div *ngIf="!identity" class="m-5">
  <div class="row">
    <!---Login-->
    <form #loginForm="ngForm" (ngSubmit)="onSubmit()" class=" form-group col-6 ">
      <div class="form-group col-md-7">
        <h1>Login</h1>
        <div *ngIf="errormessage" class="alert alert-info">
          <strong>{{errormessage}} </strong>
        </div>
        <label>Email</label>
        <input type="email" #email="ngModel" name="email" [(ngModel)]="user.email" class="form-control"
          placeholder="Ingrese su email" required>
        <span *ngIf="!email.valid && email.touched">
          el email es obligatorio
        </span>
      </div>
      <div class="form-group col-md-7">
        <label>Password</label>
        <input type="password" #password="ngModel" name="password" [(ngModel)]="user.password" class="form-control"
          placeholder="Ingrese su Contraseña" required>
      </div>
      <button type="submit" class="btn btn-outline-light ml-3">Submit</button>
    </form>
    <!------------------Registro--------------------------------------------->
    <form #registerForm="ngForm" (ngSubmit)="onSubmitRegister()" class="form-group col-6 ">

      <h1>Register</h1>
      <div *ngIf="alertRegister" class="alert alert-info">
        <strong>{{alertRegister}}</strong>
      </div>
      <div class="form-group ">
        <label for="inputEmail4">Correo Electronico</label>
        <input type="email" #email="ngModel" [(ngModel)]="user_register.email" name="email" class="form-control">
        <span *ngIf="!email.valid && email.touched">El email es obligatorio</span>
      </div>
      <div class="form-row">
        <div class="form-group col-md-6">
          <label>Password</label>
          <input type="password" #password="ngModel" name="password" [(ngModel)]="user_register.password"
            class="form-control">
          <span *ngIf="!password.valid && password.touched">El password es obligatorio</span>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group col-md-6">
          <label>Name</label>
          <input type="text" #name="ngModel" name="name" [(ngModel)]="user_register.name" class="form-control">
          <span *ngIf="!name.valid && name.touched">El nombre es obligatorio</span>
        </div>
        <div class="form-group col-md-6">
          <label>Surname</label>
          <input type="text" #surname="ngModel" name="surname" [(ngModel)]="user_register.surname"
            class="form-control">
          <span *ngIf="!surname.valid && surname.touched">Los apellidos son Obligatorios</span>
        </div>
      </div>
      <button type="submit" class="btn btn-outline-light">Sign in</button>
    </form>
  </div>
</div>
