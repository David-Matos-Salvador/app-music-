<div *ngIf="identity && identity.role=='ROLE_ADMIN'">
  <form #formSong="ngForm" (ngSubmit)="onSubmit()" >
    <h1>{{titulo +album }} </h1>
    <div class="container ">
        <div *ngIf="alertMessage" class="alert alert-info">
          <strong>{{alertMessage}}</strong>
        </div>
        <div class="form-group col-md-6 col-lg-4">
            <label>Número</label>
            <input type="text" #d="ngModel" name="description" [(ngModel)]="song.number"
              class="form-control">
            <span *ngIf="!duration.valid && duration.touched">El número de la cancion es obligatoria</span>
        </div>
        <div class="form-group col-md-6 col-lg-4">
          <label>Titulo</label>
          <input type="text" #name="ngModel" name="name" [(ngModel)]="song.name" class="form-control">
          <span *ngIf="!name.valid && name.touched">El titulo es obligatorio</span>
        </div>
        <div class="form-group col-md-6 col-lg-4">
          <label>Duration</label>
          <input type="text" #duration="ngModel" name="duration" [(ngModel)]="song.duration"
            class="form-control">
          <span *ngIf="!duration.valid && duration.touched">La Duration es  Obligatorio</span>
        </div>
        

        <div *ngIf="_isEdit">
          
          <div class="form-group col-md-6 col-lg-4" *ngIf="song.file && song.file != 'null'">
            <audio controls >  
                <source src="{{url+'get_song/'+song.file}}" type="audio/mpeg">              
                El navegador no soporta la reproduccion del audio                
            </audio>
          </div>
          <div class="form-group col-md-6 col-lg-4">
            <label >Sube la el fichero de audio </label>
            <div class="custom-file">
                <input type="file" class="custom-file-input" (change)="fileChangeEvent($event)" id="customFile">
                <label class="custom-file-label" for="customFile">subir el fichero</label>
              </div>
          </div>
          
        </div>
        <div class="text-right col-lg-4 col-md-6">
        <input type="submit"  value="canción"class="btn btn-outline-light pull-right "[disabled]="!formSong.form.valid">
             
        </div>
      </div>
</form>
</div>
