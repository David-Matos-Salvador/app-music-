<h1>{{titulo}}</h1>
<form #formAlbum="ngForm" (ngSubmit)="onSubmit()" >
    <div *ngIf="alertMessage" class="alert alert-info">
        <strong>{{alertMessage}}</strong>
    </div>
    <div class="form-group col-md-6 col-lg-6">
        <label>Titulo</label>
        <input type="text" #title="ngModel" name="title" [(ngModel)]="album.title" class="form-control">
        <span *ngIf="!title.valid && title.touched">El title es obligatorio</span>
    </div>
    <div class="form-group col-md-6 col-lg-6">
        <label>Descripción </label>
        <textarea type="text" #description="ngModel" name="description" [(ngModel)]="album.description" class="form-control"></textarea> 
        <span *ngIf="!description.valid && description.touched">La description es obligatorio</span>
    </div>
    <div class="form-group col-md-6 col-lg-6">
        <label>Año </label>
        <input type="text" #year="ngModel" name="year" [(ngModel)]="album.year" class="form-control">
        <span *ngIf="!year.valid && year.touched">El year  es obligatorio</span>
    </div>
    <div *ngIf="is_edit">
    
        <div class="form-group col-md-6 col-lg-6" *ngIf="album.image && album.image != 'null'">
            <img class="img-thumbnail" src="{{url+'get-img-album/'+album.image}}">
        </div>
        <div class="form-group col-md-6 col-lg-6">
            <label>Sube la Foto</label>
            <div class="custom-file">
                <input type="file" class="custom-file-input" (change)="fileChangeEvent($event)" id="customFile">
                <label class="custom-file-label" for="customFile">Elige la imagen</label>
            </div>
        </div>
    </div>
    <div class="text-right col-lg-4 col-md-6">
        <button type="submit" class="btn btn-outline-light pull-right " [disabled]="!formAlbum.form.valid" >{{titulo}}</button>
    </div>
</form>
